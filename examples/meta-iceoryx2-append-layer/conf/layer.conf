# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes/*.bbappend"

BBFILE_COLLECTIONS += "meta-iceoryx2-append"
BBFILE_PATTERN_meta-iceoryx2-append = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-iceoryx2-append = "7"
BBFILE_PATTERN_IGNORE_EMPTY_meta-iceoryx2-append = "1"

LAYERDEPENDS_meta-iceoryx2-append = "meta-iceoryx2"
LAYERSERIES_COMPAT_meta-iceoryx2-append = "blacksail"
